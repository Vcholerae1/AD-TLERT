[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "adtlert"
version = "0.1.0"
description = "Differentiable 2.5D and 3D electrical resistivity tomography on PyTorch"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pu Yang", email = "165551159+Vcholerae1@users.noreply.github.com" },
]
keywords = [
    "electrical resistivity tomography",
    "geophysics",
    "inverse problems",
    "pytorch",
    "scientific computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "meshio>=5.3.5",
    "numpy>=1.26,<3",
    "scipy>=1.16,<2",
    "torch>=2.10,<3",
]

[project.optional-dependencies]
cuda12 = [
    "cupy-cuda12x>=14,<15; sys_platform == 'linux'",
    "nvidia-cudss-cu12>=0.7.1.6,<1; sys_platform == 'linux'",
    "nvmath-python[cu12]>=0.8,<2; sys_platform == 'linux'",
]
terrain = [
    "pftools>=1.3.14",
    "triangle>=20250106",
]
examples = [
    "ipykernel>=7.2",
    "joblib>=1.5",
    "matplotlib>=3.10",
    "pandas>=2.2",
    "pftools>=1.3.14",
    "pygimli>=1.6,<2",
    "pyhydrogeophysx>=0.1",
    "triangle>=20250106",
]

[project.urls]
Homepage = "https://github.com/Vcholerae1/AD-TLERT"
Documentation = "https://github.com/Vcholerae1/AD-TLERT#readme"
Repository = "https://github.com/Vcholerae1/AD-TLERT"
Issues = "https://github.com/Vcholerae1/AD-TLERT/issues"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["adtlert"]

[tool.hatch.build.targets.sdist]
include = [
    "/adtlert",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]
