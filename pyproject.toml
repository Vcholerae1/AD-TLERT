[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "adtlert"
version = "0.2.0"
description = "CUDA-accelerated differentiable 2.5D and 3D electrical resistivity tomography on PyTorch"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pu Yang", email = "165551159+Vcholerae1@users.noreply.github.com" },
]
keywords = [
    "electrical resistivity tomography",
    "geophysics",
    "inverse problems",
    "pytorch",
    "scientific computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    # cuda-core 1.x fails to create pinned memory pools for cuDSS on WSL (checked with nvmath-python 1.0).
    "cuda-core>=0.7,<1",
    "meshio>=5.3.5",
    "numpy>=1.26,<3",
    "nvidia-cudss-cu12>=0.8,<1",
    "nvmath-python[cu12]>=1.0,<2",
    "scipy>=1.16,<2",
    "torch>=2.10,<3",
]

[project.optional-dependencies]
terrain = [
    "pftools>=1.3.14",
    "triangle>=20250106",
]
examples = [
    "ipykernel>=7.2",
    "joblib>=1.5",
    "matplotlib>=3.10",
    "pandas>=2.2",
    "pftools>=1.3.14",
    "pygimli>=1.6,<2",
    "pyhydrogeophysx>=0.1",
    "triangle>=20250106",
]

[project.urls]
Homepage = "https://github.com/Vcholerae1/AD-TLERT"
Documentation = "https://github.com/Vcholerae1/AD-TLERT#readme"
Repository = "https://github.com/Vcholerae1/AD-TLERT"
Issues = "https://github.com/Vcholerae1/AD-TLERT/issues"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "PIE", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Scripts set environment variables and sys.path before importing adtlert (E402), and favour
# directness over style rules.
"example/**" = ["B", "C4", "E402", "E7", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gpu: needs an NVIDIA GPU (cuDSS, Triton); skipped automatically without one"]

[tool.hatch.build.targets.wheel]
packages = ["adtlert"]

[tool.hatch.build.targets.sdist]
include = [
    "/adtlert",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
